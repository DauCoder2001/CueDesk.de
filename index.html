<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="version" content="0.1.0">
  <title>CueDesk</title>
  <style>
    :root { --bg:#f6f7f9; --fg:#1b1f24; --muted:#5b6470; --accent:#1f6feb; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0f1216; --fg:#e8eaed; --muted:#9aa3ad; --accent:#58a6ff; } }
    html,body { margin:0; height:100%; }
    body { background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
           display:flex; align-items:center; justify-content:center; text-align:center; padding:0 16px; }
    h1 { font-size:2.5rem; margin:0 0 .5rem; }
    p { color:var(--muted); margin:.25rem 0 1.5rem; }
    a.btn { display:inline-block; padding:.7rem 1.4rem; border-radius:8px; background:var(--accent); color:#fff; text-decoration:none; font-weight:600; }
    footer { position:fixed; bottom:12px; left:0; right:0; font-size:.75rem; color:var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>CueDesk</h1>
    <p>Hier entsteht die neue Website.</p>
    <a class="btn" href="https://app.cuedesk.de">Zur App</a>
  </main>
  <footer>Version 0.1.0</footer>
</body>
</html>
